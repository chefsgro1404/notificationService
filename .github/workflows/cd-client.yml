name: CD - Deploy Web App (Next.js client)

# Builds the Next.js client in client/ and deploys it to an Azure App Service (Linux, Node 24).
# Runtime settings (Entra sign-in, Functions URL/key, session secret) are App Service application
# settings, not build inputs, so one build works in any environment.

on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'app-notification-web-prod-001'   # <- the App Service name
  NODE_VERSION: '24'
  CLIENT_PATH: 'client'

jobs:
  deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # OIDC login to Azure
      contents: read

    defaults:
      run:
        working-directory: ${{ env.CLIENT_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_PATH }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage (must be above 90%)
        run: npm run test:coverage

      - name: Show coverage in run summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build (standalone output)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # next build writes a self-contained server to .next/standalone; static files and public/
      # must be copied next to it (https://nextjs.org/docs/app/api-reference/config/next-config-js/output).
      - name: Assemble deployment package
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          test -f .next/standalone/server.js

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.CLIENT_PATH }}/.next/standalone
          startup-command: 'node server.js'

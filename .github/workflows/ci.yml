name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/NotificationService.Functions/NotificationService.Functions.csproj'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test tests/NotificationService.Tests/NotificationService.Tests.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Build coverage report
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: HtmlInline;MarkdownSummaryGithub

      - name: Show coverage in run summary
        if: ${{ !cancelled() }}
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

      - name: Require coverage above 90%
        run: python3 .github/scripts/check-coverage.py ./coverage 90

  client:
    name: Client (Next.js) - Lint, Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage (must be above 90%)
        run: npm run test:coverage

      - name: Show coverage in run summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
